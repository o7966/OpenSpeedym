name: Build cl

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-artifacts.outputs.artifact-id }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 5.15 64-bit
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        setup-python: false

    - name: Install Qt 5.15 32-bit
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        host: windows
        target: desktop
        arch: win32_msvc2019
        setup-python: false
        install-deps: false

    - name: Find Visual Studio and Qt paths
      id: paths
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Write-Output "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

        # Find actual Qt install paths - check common locations
        $qt64 = Get-ChildItem "C:\Qt\5.15*\msvc2019_64" -ErrorAction SilentlyContinue | Select-Object -First 1
        $qt32 = Get-ChildItem "C:\Qt\5.15*\msvc2019" -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $qt64) { $qt64 = Get-ChildItem "D:\*\Qt\5.15*\msvc2019_64" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1 }
        if (-not $qt32) { $qt32 = Get-ChildItem "D:\*\Qt\5.15*\msvc2019" -Recurse -Directory -ErrorAction SilentlyContinue | Select-Object -First 1 }
        Write-Output "QT64_PATH=$($qt64.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Output "QT32_PATH=$($qt32.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Qt64: $($qt64.FullName)"
        Write-Host "Qt32: $($qt32.FullName)"

    - name: Build 64-bit
      shell: cmd
      run: |
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT64_PATH%" -DQt5_DIR="%QT64_PATH%\lib\cmake\Qt5" -S . -B build\x64
        cmake --build build\x64

    - name: Build 32-bit
      shell: cmd
      run: |
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars32.bat"
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT32_PATH%" -DQt5_DIR="%QT32_PATH%\lib\cmake\Qt5" -S . -B build\x86
        cmake --build build\x86

    - name: Collect artifacts
      shell: cmd
      run: |
        mkdir artifacts 2>nul
        copy "build\x64\cl.exe" "artifacts\"
        copy "build\x64\cl64.dll" "artifacts\"
        copy "build\x64\cl64.exe" "artifacts\"
        copy "build\x86\cl32.dll" "artifacts\"
        copy "build\x86\cl32.exe" "artifacts\"
        dir artifacts

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cl-artifacts
        path: artifacts/
        if-no-files-found: warn
        retention-days: 30
