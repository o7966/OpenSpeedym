name: Build cl

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  VCPKG_DIR: C:\vcpkg

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-artifacts.outputs.artifact-id }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add swap space (Windows)
      shell: powershell
      run: |
        # Enable pagefile (swap) on Windows to prevent OOM during Qt build
        $pagefile = Get-CimInstance Win32_PageFileSetting
        $os = Get-CimInstance Win32_OperatingSystem
        $swapSize = 16384  # 16GB
        if ($null -eq $pagefile -or $pagefile.InitialSize -lt $swapSize) {
          $sysDrive = $env:SystemDrive
          Set-CimInstance -Query "SELECT * FROM Win32_ComputerSystem" -Property @{AutomaticManagedPagefile=$false}
          Set-CimInstance -Query "SELECT * FROM Win32_PageFileSetting WHERE Name='$sysDrive\\pagefile.sys'" -Property @{InitialSize=$swapSize; MaximumSize=$swapSize} -ErrorAction SilentlyContinue
          # If pagefile doesn't exist, create it via WMI
          $pageFileSetting = [WMI]'Win32_PageFileSetting.Name=""'
          if ($pageFileSetting -eq $null) {
            $computerSystem = Get-CimInstance Win32_ComputerSystem
            $computerSystem.AutomaticManagedPagefile = $false
            $computerSystem.Put()
          }
          Write-Host "Pagefile configured for ${swapSize}MB"
        }

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DIR }}
        key: vcpkg-qt5-static-v3-full

    - name: Install vcpkg and dependencies
      shell: bash
      run: |
        if [ ! -f "$VCPKG_DIR/vcpkg.exe" ]; then
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_DIR
        fi
        $VCPKG_DIR/bootstrap-vcpkg.bat

        # Create overlay triplets
        mkdir -p triplets

        printf 'set(VCPKG_TARGET_ARCHITECTURE x64)\nset(VCPKG_CRT_LINKAGE static)\nset(VCPKG_LIBRARY_LINKAGE static)\nset(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "${VCPKG_ROOT_DIR}/triplets/x64-windows.cmake")\n' > triplets/x64-windows-static.cmake

        printf 'set(VCPKG_TARGET_ARCHITECTURE x86)\nset(VCPKG_CRT_LINKAGE static)\nset(VCPKG_LIBRARY_LINKAGE static)\nset(VCPKG_CHAINLOAD_TOOLCHAIN_FILE "${VCPKG_ROOT_DIR}/triplets/x86-windows.cmake")\n' > triplets/x86-windows-static.cmake

        # Install Qt5 static packages
        $VCPKG_DIR/vcpkg install qt5-base:x64-windows-static --overlay-triplets=triplets
        $VCPKG_DIR/vcpkg install qt5-tools:x64-windows-static --overlay-triplets=triplets
        $VCPKG_DIR/vcpkg install qt5-winextras:x64-windows-static --overlay-triplets=triplets
        $VCPKG_DIR/vcpkg install qt5-base:x86-windows-static --overlay-triplets=triplets
        $VCPKG_DIR/vcpkg install qt5-tools:x86-windows-static --overlay-triplets=triplets
        $VCPKG_DIR/vcpkg install qt5-winextras:x86-windows-static --overlay-triplets=triplets

    - name: Build 64-bit
      shell: cmd
      run: |
        set QT_QMAKE=%VCPKG_DIR%\installed\x64-windows-static\tools\qt5\bin\qmake.exe
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DQT_QMAKE_EXECUTABLE:FILEPATH="%QT_QMAKE%" -S . -B build\x64
        cmake --build build\x64

    - name: Build 32-bit
      shell: cmd
      run: |
        set QT_QMAKE=%VCPKG_DIR%\installed\x86-windows-static\tools\qt5\bin\qmake.exe
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DQT_QMAKE_EXECUTABLE:FILEPATH="%QT_QMAKE%" -S . -B build\x86
        cmake --build build\x86

    - name: Collect artifacts
      shell: cmd
      run: |
        mkdir artifacts 2>nul
        copy "build\x64\cl.exe" "artifacts\"
        copy "build\x64\cl64.dll" "artifacts\"
        copy "build\x64\cl64.exe" "artifacts\"
        copy "build\x86\cl32.dll" "artifacts\"
        copy "build\x86\cl32.exe" "artifacts\"
        dir artifacts

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cl-artifacts
        path: artifacts/
        if-no-files-found: warn
        retention-days: 30
