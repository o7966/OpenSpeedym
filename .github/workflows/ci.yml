name: Build cl

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-64:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 5.15 64-bit
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        setup-python: false

    - name: Find Visual Studio
      id: vs
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Write-Output "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build 64-bit
      shell: cmd
      run: |
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
        for /f %%i in ('qmake -query QT_INSTALL_PREFIX') do set QT_DIR=%%i
        echo Using Qt at %QT_DIR%
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_DIR%" -S . -B build\x64
        cmake --build build\x64

    - name: Deploy Qt DLLs
      shell: cmd
      run: |
        mkdir release
        copy "build\x64\cl.exe" release\
        copy "build\x64\cl64.dll" release\
        copy "build\x64\cl64.exe" release\
        for /f %%i in ('qmake -query QT_INSTALL_PREFIX') do set QT_DIR=%%i
        %QT_DIR%\bin\windeployqt.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw release\cl.exe
        dir release

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cl-release
        path: release/
        retention-days: 30

  build-32:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 5.15 32-bit
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        host: windows
        target: desktop
        arch: win32_msvc2019
        setup-python: false

    - name: Find Visual Studio
      id: vs
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Write-Output "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build 32-bit
      shell: cmd
      run: |
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars32.bat"
        for /f %%i in ('qmake -query QT_INSTALL_PREFIX') do set QT_DIR=%%i
        echo Using Qt at %QT_DIR%
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_DIR%" -S . -B build\x86
        cmake --build build\x86

    - name: Upload 32-bit bridge
      uses: actions/upload-artifact@v4
      with:
        name: cl-x86
        path: |
          build\x86\cl32.dll
          build\x86\cl32.exe
        retention-days: 30
