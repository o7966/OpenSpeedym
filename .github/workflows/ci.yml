name: Build cl

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-artifacts.outputs.artifact-id }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 5.15
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        host: windows
        target: desktop
        arch: win64_msvc2019_64
        arch-win32: win32_msvc2019
        setup-python: false

    - name: Build 64-bit
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=C:\Qt\5.15\msvc2019_64\bin;%PATH%
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\5.15\msvc2019_64" -S . -B build\x64
        cmake --build build\x64

    - name: Build 32-bit
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
        set PATH=C:\Qt\5.15\msvc2019\bin;%PATH%
        cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:\Qt\5.15\msvc2019" -S . -B build\x86
        cmake --build build\x86

    - name: Collect artifacts
      shell: cmd
      run: |
        mkdir artifacts 2>nul
        copy "build\x64\cl.exe" "artifacts\"
        copy "build\x64\cl64.dll" "artifacts\"
        copy "build\x64\cl64.exe" "artifacts\"
        copy "build\x86\cl32.dll" "artifacts\"
        copy "build\x86\cl32.exe" "artifacts\"
        dir artifacts

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: cl-artifacts
        path: artifacts/
        if-no-files-found: warn
        retention-days: 30
